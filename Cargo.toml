[workspace]
resolver = "2"
members = ["engine", "cli", "python"]
# Plain `cargo build` / `cargo test` skip the Python crate; build it with maturin.
default-members = ["engine", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
