[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "dasanyuan"
version = "0.1.0"
description = "Python bindings for the da-san-yuan Singapore mahjong engine"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[tool.maturin]
module-name = "dasanyuan._core"
python-source = "."
features = ["pyo3/extension-module"]
