[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dasanyuan"
version = "0.1.0"
description = "Singapore 4-player mahjong rules engine, heuristic bots and self-play data logger"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dsy = "dasanyuan.cli:main"

[tool.setuptools]
packages = ["dasanyuan"]
